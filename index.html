<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rak | Links</title>
<meta name="description" content="Room setup, home, fragrance collection and fashion finds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece8f2;
    --ink: #231e30;
    --ink-soft: #5d566d;
    --sage: #cfdacb;
    --sand: #ead9c2;
    --amber: #ecc67f;
    --rose: #e6c4cd;
    --line: rgba(35, 30, 48, .14);
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.45;
    padding: max(32px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
  }
  main { max-width: 440px; margin: 0 auto; }

  /* Profile */
  header { text-align: center; padding: 8px 0 22px; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    margin: 0 auto 14px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-size: 44px; font-weight: 800;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .handle { margin: 2px 0 0; color: var(--ink-soft); font-size: 15px; }
  .bio { margin: 12px auto 0; max-width: 32ch; font-size: 16px; }

  /* Socials */
  .socials { display: flex; justify-content: center; gap: 12px; margin: 20px 0 0; padding: 0; list-style: none; }
  .socials a {
    width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1.5px solid var(--ink); color: var(--ink);
    text-decoration: none;
    transition: background .15s, color .15s;
  }
  .socials a:hover { background: var(--ink); color: var(--bg); }
  .socials svg { width: 22px; height: 22px; display: block; }

  /* Categories */
  .cats { display: grid; gap: 12px; margin-top: 6px; }
  details { border-radius: 22px; background: var(--tint); }
  details summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 20px 22px;
    border-radius: 22px;
  }
  details summary::-webkit-details-marker { display: none; }
  .cat-title { font-size: 21px; font-weight: 800; letter-spacing: -.01em; display: block; }
  .cat-blurb { font-size: 14px; color: var(--ink-soft); display: block; margin-top: 1px; }
  .chev { flex: none; width: 22px; height: 22px; transition: transform .2s; }
  details[open] .chev { transform: rotate(180deg); }
  details[open] summary { padding-bottom: 12px; }

  .items { list-style: none; margin: 0; padding: 0 12px 12px; display: grid; gap: 6px; }
  .items a {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 13px 14px;
    background: rgba(255, 255, 255, .6);
    border-radius: 14px;
    color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15.5px;
  }
  .items a:hover { background: #fff; }
  .items .row { display: block; }
  .items .row-title { display: block; }
  .items .row-note { display: block; margin-top: 2px; font-weight: 400; font-size: 13.5px; color: var(--ink-soft); }
  .items .static { padding: 13px 14px; border-radius: 14px; border: 1.5px dashed var(--line); font-weight: 600; font-size: 15.5px; }
  .price { flex: none; font-weight: 400; color: var(--ink-soft); font-size: 14px; }
  .empty { padding: 0 22px 18px; margin: 0; color: var(--ink-soft); font-size: 14px; }

  a:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  footer { margin-top: 28px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
  footer p { margin: 0 auto; max-width: 34ch; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="handle" id="handle"></p>
    <p class="bio" id="bio"></p>
    <ul class="socials" id="socials"></ul>
  </header>

  <section class="cats" id="cats" aria-label="Shop by category"></section>

  <footer>
    <p class="support">A way to support me :)</p>
  </footer>
</main>

function tagged(url) {
  try {
    const u = new URL(url);
    if (/(^|\.)amazon\./i.test(u.hostname)) u.searchParams.set("tag", AMAZON_TAG);
    return u.toString();
  } catch (e) { return url; }
}

// Profile
document.getElementById("name").textContent = PROFILE.name;
document.getElementById("handle").textContent = PROFILE.handle;
document.getElementById("bio").textContent = PROFILE.bio;
const avatar = document.getElementById("avatar");
if (PROFILE.avatar) {
  const img = document.createElement("img");
  img.src = PROFILE.avatar;
  img.alt = "";
  img.onerror = () => { img.remove(); avatar.textContent = PROFILE.name.charAt(0).toUpperCase(); };
  avatar.appendChild(img);
} else {
  avatar.textContent = PROFILE.name.charAt(0).toUpperCase();
  avatar.setAttribute("aria-label", PROFILE.name);
}

// Socials
const socialsEl = document.getElementById("socials");
Object.keys(SOCIALS).forEach(key => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = SOCIALS[key];
  a.target = "_blank";
  a.rel = "noopener";
  a.setAttribute("aria-label", SOCIAL_LABELS[key] || key);
  a.innerHTML = ICONS[key] || "";
  li.appendChild(a);
  socialsEl.appendChild(li);
});

// Categories
const catsEl = document.getElementById("cats");
const chevron = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

CATEGORIES.forEach(cat => {
  const d = document.createElement("details");
  d.style.setProperty("--tint", cat.tint);

  const s = document.createElement("summary");
  const text = document.createElement("span");
  const t = document.createElement("span"); t.className = "cat-title"; t.textContent = cat.title;
  const b = document.createElement("span"); b.className = "cat-blurb"; b.textContent = cat.blurb;
  text.append(t, b);
  s.appendChild(text);
  s.insertAdjacentHTML("beforeend", chevron);
  d.appendChild(s);

  if (cat.items.length) {
    const ul = document.createElement("ul");
    ul.className = "items";
    cat.items.forEach(item => {
      const li = document.createElement("li");
      const inner = document.createElement("span");
      inner.className = "row";
      const label = document.createElement("span"); label.className = "row-title"; label.textContent = item.title;
      inner.appendChild(label);
      if (item.note) {
        const n = document.createElement("span"); n.className = "row-note"; n.textContent = item.note;
        inner.appendChild(n);
      }
      if (item.url) {
        const a = document.createElement("a");
        a.href = tagged(item.url);
        a.target = "_blank";
        a.rel = "noopener sponsored";
        a.appendChild(inner);
        if (item.price) {
          const p = document.createElement("span"); p.className = "price"; p.textContent = item.price;
          a.appendChild(p);
        }
        li.appendChild(a);
      } else {
        const box = document.createElement("div");
        box.className = "static";
        box.appendChild(inner);
        li.appendChild(box);
      }
      ul.appendChild(li);
    });
    d.appendChild(ul);
  } else {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Coming soon.";
    d.appendChild(p);
  }
  catsEl.appendChild(d);
});
